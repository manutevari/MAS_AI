services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mas_ai_agent
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mas_ai
      - PYTHONUNBUFFERED=1
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts

  db:
    image: pgvector/pgvector:pg16
    container_name: mas_ai_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mas_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mas_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
